name: Try to Create OCI VM
on:
  schedule:
    - cron: "*/10 * * * *"
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:
concurrency:
  group: create-oci-vm
  cancel-in-progress: false
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.phx.aaaaaaaafyvgnzeatevnnrx2yuay2p7uarefgnbhibpwwk2gkor4r5zbumea"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "MJed:PHX-AD-3"
  OCI_CLI_REGION: "us-phoenix-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        # This forces the job to succeed so the cache will save.
        continue-on-error: true 
        run: |
          set -o pipefail

          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          OCI_CLI_VERSION=$(oci --version 2>&1 || true)
          OCI_OUTPUT="OCI CLI version: ${OCI_CLI_VERSION}"
          MAX_ATTEMPTS=3

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Starting OCI launch attempt ${attempt}/${MAX_ATTEMPTS}"

            set +e
            ATTEMPT_OUTPUT=$(oci --connection-timeout 45 --read-timeout 300 compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "fzhang-vm" \
              --boot-volume-size-in-gbs 100 2>&1)
            ATTEMPT_EXIT=$?
            set -e

            OCI_OUTPUT="${OCI_OUTPUT}"$'\n\n'"===== OCI launch attempt ${attempt}/${MAX_ATTEMPTS} exit ${ATTEMPT_EXIT} ====="$'\n'"${ATTEMPT_OUTPUT}"

            if echo "$ATTEMPT_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              break
            fi

            if echo "$ATTEMPT_OUTPUT" | grep -q "Out of host capacity."; then
              break
            fi

            if echo "$ATTEMPT_OUTPUT" | grep -qi "connection to endpoint timed out" && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              OCI_OUTPUT="${OCI_OUTPUT}"$'\n'"Retrying after endpoint timeout in ${sleep_seconds}s."
              sleep "$sleep_seconds"
              continue
            fi

            break
          done

          # Store the log as a GitHub step output
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check the log content for an error string.
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "Success! 'PROVISIONING' state found in output."
            exit 0
          else
            echo "Error: Success string not found in OCI output. Failing the step."
            exit 1
          fi

      - name: Send Discord Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CREATE_VM_OUTCOME: ${{ steps.create_vm.outcome }}
          OCI_LOG_DATA: ${{ steps.create_vm.outputs.log_data }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty or missing."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          outcome = os.environ.get("CREATE_VM_OUTCOME", "unknown")
          log_data = os.environ.get("OCI_LOG_DATA", "")
          max_log_chars = 3000

          if len(log_data) > max_log_chars:
              log_data = (
                  log_data[:max_log_chars]
                  + "\n\n... truncated; open the GitHub Actions run for the full log."
              )

          color = 0x28A745 if outcome == "success" else 0xDC3545
          payload = {
              "embeds": [
                  {
                      "title": f"OCI VM Status: {outcome}",
                      "description": (
                          "Attempt to create A1.Flex VM.\n"
                          f"**Status:** `{outcome}`\n\n"
                          "**Log Output:**\n"
                          f"```json\n{log_data}\n```"
                      ),
                      "color": color,
                  }
              ]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          if [[ "$WEBHOOK_URL" == *\?* ]]; then
            discord_url="${WEBHOOK_URL}&wait=true"
          else
            discord_url="${WEBHOOK_URL}?wait=true"
          fi

          http_status=$(curl -sS -o discord-response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data @discord-payload.json \
            "$discord_url")

          echo "Discord webhook HTTP status: ${http_status}"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Discord webhook response body:"
            cat discord-response.json
            exit 1
          fi

          echo "Discord webhook accepted the notification."
